name: Mise à jour des prix (RNM FranceAgriMer)

on:
  schedule:
    # Mardi et vendredi à 6h00 UTC : nouveaux prix de détail hebdomadaires
    - cron: "0 6 * * 2,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer les prix RNM
        run: node scripts/fetch-prices.mjs

      - name: Vérifier que le site se construit
        run: npm run build

      - name: Commit et push si changement
        run: |
          git config user.name "de-saison-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/prix-rnm.json data/prix-historique.json; then
            echo "Aucun changement de prix."
            exit 0
          fi
          git add data/prix-rnm.json data/prix-historique.json
          git commit -m "chore(prix): relevé RNM du $(date -u +%Y-%m-%d)"
          git push
