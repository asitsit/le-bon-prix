name: Mise à jour hebdomadaire des prix

on:
  schedule:
    # Tous les lundis à 6h00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer les nouveaux prix
        run: node scripts/fetch-prices.mjs

      - name: Régénérer produits.json
        run: node scripts/build-data.mjs

      - name: Commit et push si changement
        run: |
          git config user.name "de-saison-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/produits.csv; then
            echo "Aucun changement de prix cette semaine."
            exit 0
          fi
          git add data/produits.csv
          git commit -m "chore(prices): mise à jour hebdomadaire des prix marché"
          git push
